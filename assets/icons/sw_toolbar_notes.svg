<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 64 64"
   width="64"
   height="64"
   version="1.1"
   id="svg4"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs2">
    <filter
       id="glow"
       x="-1.2"
       y="-1.2"
       width="3.4"
       height="3.4">
      <feGaussianBlur
         stdDeviation="2.5"
         result="b"
         id="feGaussianBlur1" />
      <feMerge
         id="feMerge2">
        <feMergeNode
           in="b"
           id="feMergeNode1" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode2" />
      </feMerge>
    </filter>
  </defs>
  <rect
     x="3"
     y="3"
     width="58"
     height="58"
     rx="14"
     fill="#0d0021"
     id="rect2" />
  <rect
     x="3"
     y="3"
     width="58"
     height="58"
     rx="14"
     fill="none"
     stroke="#6b30a8"
     stroke-width="1.5"
     id="rect3" />
  <!-- Pencil body: diagonal parallelogram -->
  <path
     d="M14 50 L18 42 L46 14 L52 20 L24 48 Z"
     fill="#ff2d78"
     filter="url(#glow)"
     id="path3" />
  <!-- Gold tip -->
  <path
     d="M14 50 L18 42 L22 46 Z"
     fill="#ffcc00"
     filter="url(#glow)"
     id="path4" />
  <!-- Cyan point -->
  <circle
     cx="12"
     cy="52"
     r="2.5"
     fill="#00f5ff"
     filter="url(#glow)"
     id="circle4" />
  <!-- Highlight stripe on body -->
  <line
     x1="20"
     y1="44"
     x2="48"
     y2="16"
     stroke="#ff80aa"
     stroke-width="3"
     stroke-linecap="round"
     opacity="0.5"
     id="line4" />
  <!-- Eraser end (top-right) -->
  <rect
     x="47"
     y="12"
     width="9"
     height="7"
     rx="2"
     transform="rotate(-45 51.5 15.5)"
     fill="#ff9ec0"
     id="rect4" />
</svg>
